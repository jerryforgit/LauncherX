name: Feature request
description: Suggest a feature or improvement for LauncherX.
labels: [feature-request]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please explain the use case, not only the implementation.
        LauncherX is a fork of Lawnchair 16, so some requests may belong upstream.

  - type: textarea
    id: feature
    attributes:
      label: Describe the feature
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What problem does it solve, and who benefits?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples / mockups
    validations:
      required: false
